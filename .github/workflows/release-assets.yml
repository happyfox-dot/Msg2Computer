name: Build and upload release assets

on:
  workflow_dispatch:
  push:
    branches:
      - softbus_p2p

permissions:
  contents: write

jobs:
  build-release-assets:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release-build]')
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve release version
        shell: pwsh
        run: |
          $desktopPackage = Get-Content -Raw -Path desktop/package.json | ConvertFrom-Json
          $rootPackage = Get-Content -Raw -Path package.json | ConvertFrom-Json
          $lock = Get-Content -Raw -Path desktop/package-lock.json | ConvertFrom-Json -AsHashtable
          $androidGradle = Get-Content -Raw -Path android/app/build.gradle.kts
          $androidVersionName = [regex]::Match($androidGradle, 'versionName\s*=\s*"([^"]+)"').Groups[1].Value
          $androidVersionCode = [regex]::Match($androidGradle, 'versionCode\s*=\s*(\d+)').Groups[1].Value
          $appVersion = $desktopPackage.version

          if (-not $appVersion -or -not $androidVersionName -or -not $androidVersionCode) {
            throw 'Unable to resolve release versions'
          }
          if ($rootPackage.version -ne $appVersion -or
              $lock['version'] -ne $appVersion -or
              $lock['packages']['']['version'] -ne $appVersion -or
              $androidVersionName -ne $appVersion) {
            throw "Release version mismatch: root=$($rootPackage.version), desktop=$appVersion, lock=$($lock['version']), lockRoot=$($lock['packages']['']['version']), android=$androidVersionName"
          }

          "APP_VERSION=$appVersion" >> $env:GITHUB_ENV
          "ANDROID_VERSION_CODE=$androidVersionCode" >> $env:GITHUB_ENV
          "RELEASE_TAG=v$appVersion" >> $env:GITHUB_ENV

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Restore Android signing key
        shell: pwsh
        env:
          KEYSTORE_BASE64: ${{ secrets.CODEBRIDGE_KEYSTORE_BASE64 }}
        run: |
          if (-not $env:KEYSTORE_BASE64) { throw 'Missing CODEBRIDGE_KEYSTORE_BASE64 secret' }
          New-Item -ItemType Directory -Force -Path android/release | Out-Null
          [IO.File]::WriteAllBytes(
            (Resolve-Path android/release).Path + '\codebridge-release.jks',
            [Convert]::FromBase64String($env:KEYSTORE_BASE64)
          )

      - name: Build desktop installer
        shell: pwsh
        working-directory: desktop
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          npm ci
          npm test
          npx electron-builder --win --publish never

      - name: Build Android APK
        shell: pwsh
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.CODEBRIDGE_KEYSTORE_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          if (-not $env:KEYSTORE_PASSWORD) { throw 'Missing CODEBRIDGE_KEYSTORE_PASSWORD secret' }
          .\gradlew.bat `
            "-Dorg.gradle.java.home=$env:JAVA_HOME" `
            "-Dorg.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8" `
            :app:testDebugUnitTest :app:lintDebug :app:assembleRelease --no-daemon

      - name: Verify Android release identity
        shell: pwsh
        env:
          EXPECTED_ANDROID_CERT_SHA256: 3ff4b892c305394b406e4ee43aa41197e84d690755a8667eaff46a6ebf774239
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $apk = (Resolve-Path 'android/app/build/outputs/apk/release/app-release.apk').Path
          $sdkRoot = if ($env:ANDROID_SDK_ROOT) { $env:ANDROID_SDK_ROOT } else { $env:ANDROID_HOME }
          $buildTools = Get-ChildItem -Path (Join-Path $sdkRoot 'build-tools') -Directory |
            Sort-Object { [version]$_.Name } -Descending |
            Select-Object -First 1
          if (-not $buildTools) { throw 'Android build-tools not found' }

          $apksigner = Join-Path $buildTools.FullName 'apksigner.bat'
          $aapt = Join-Path $buildTools.FullName 'aapt.exe'
          if (-not (Test-Path $apksigner) -or -not (Test-Path $aapt)) {
            throw "Required APK verification tools not found in $($buildTools.FullName)"
          }

          $signatureLines = & $apksigner verify --verbose --print-certs-pem $apk 2>&1
          $signatureText = $signatureLines -join "`n"
          $certificateMatches = [regex]::Matches(
            $signatureText,
            '-----BEGIN CERTIFICATE-----\s*(?<base64>[A-Za-z0-9+/=\s]+?)\s*-----END CERTIFICATE-----',
            [System.Text.RegularExpressions.RegexOptions]::Singleline
          )
          if ($certificateMatches.Count -ne 1) {
            throw "APK must expose exactly one signing certificate; found $($certificateMatches.Count)"
          }
          $certificateBase64 = $certificateMatches[0].Groups['base64'].Value -replace '\s', ''
          $certificateBytes = [Convert]::FromBase64String($certificateBase64)
          $sha256 = [Security.Cryptography.SHA256]::Create()
          try {
            $actualCert = ([BitConverter]::ToString($sha256.ComputeHash($certificateBytes)) -replace '-', '').ToLowerInvariant()
          } finally {
            $sha256.Dispose()
          }
          if ($actualCert -ne $env:EXPECTED_ANDROID_CERT_SHA256) {
            throw "Unexpected Android signing certificate: $actualCert"
          }
          if ($signatureText -notmatch 'Verified using v2 scheme \(APK Signature Scheme v2\): true') {
            throw 'APK must have a valid v2 signature'
          }

          $badgingLines = & $aapt dump badging $apk 2>&1
          $badging = $badgingLines -join "`n"
          $escapedVersion = [regex]::Escape($env:APP_VERSION)
          $escapedVersionCode = [regex]::Escape($env:ANDROID_VERSION_CODE)
          if ($badging -notmatch "package: name='com\.codesync'") {
            throw 'Unexpected Android application ID'
          }
          if ($badging -notmatch "versionName='$escapedVersion'") {
            throw "APK versionName does not match $env:APP_VERSION"
          }
          if ($badging -notmatch "versionCode='$escapedVersionCode'") {
            throw "APK versionCode does not match $env:ANDROID_VERSION_CODE"
          }
          if ($badging -match '(?m)^application-debuggable') {
            throw 'Debuggable APKs must never be published'
          }

          "Verified Android release: com.codesync $env:APP_VERSION ($env:ANDROID_VERSION_CODE), signer $actualCert" >> $env:GITHUB_STEP_SUMMARY

      - name: Stage Android release asset
        shell: pwsh
        working-directory: android
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item -Force app/build/outputs/apk/release/app-release.apk "release/Msg2Computer-Android-$env:APP_VERSION.apk"

      - name: Ensure GitHub release exists
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = @"
          ## Msg2Computer $env:APP_VERSION

          Automated release assets built by GitHub Actions.
          "@
          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Msg2Computer $env:APP_VERSION" --notes $notes --latest
          }

      - name: Upload release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --clobber `
            "desktop/dist/Msg2Computer-Setup-$env:APP_VERSION.exe#Msg2Computer-Setup-$env:APP_VERSION.exe" `
            "desktop/dist/Msg2Computer-Setup-$env:APP_VERSION.exe.blockmap#Msg2Computer-Setup-$env:APP_VERSION.exe.blockmap" `
            "desktop/dist/latest.yml#latest.yml" `
            "android/release/Msg2Computer-Android-$env:APP_VERSION.apk#Msg2Computer-Android-$env:APP_VERSION.apk"
